<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre" placeholder="Nombre:"><br>

        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" id="apellido" placeholder="Apellido:"><br>

        <label>Sexo:</label>
        <input type="radio" name="sexo" id="masculino" value="masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" name="sexo" id="femenino" value="femenino">
        <label for="femenino">Femenino</label><br>

        <label for="edad">Edad:</label>
        <input type="text" name="edad" id="edad" placeholder="Edad:"><br>

        <label for="email">Email:</label>
        <input type="text" name="email" id="email" placeholder="Email:"><br>

        <label for="usuario">Usuario:</label>
        <input type="text" name="usuario" id="usuario" placeholder="Usuario:"><br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Password:"><br>

        <label for="confirmar_password">Confirmar Password:</label>
        <input type="password" name="confirmar_password" id="confirmar_password" placeholder="Confirmar Password:"><br>

        <label for="tipo_servicio">Tipo de servicio:</label>
        <select name="tipo_servicio" id="tipo_servicio">
            <option value="free">Free</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
        </select><br>

        <label for="Tema">Tema:</label>
        <input type="checkbox" name="tema" id="tema1">Política
        <input type="checkbox" name="tema" id="tema2">Negocios
        <input type="checkbox" name="tema" id="tema3">Tecnología
        <input type="checkbox" name="tema" id="tema4">Salud<br>

        <label for="comentario">Agregue un comentario:</label>
        <textarea name="comentario" id="comentario" cols="30" rows="3|"></textarea><br>

        <input type="submit" value="Enviar">
    </form>
</body>

</html>
